; Never show errors to visitors - log them instead.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Matches the app's previous PHP_INI_SESSION_UPLOAD_PROGRESS_ENABLED=Off setting.
session.upload_progress.enabled = Off

; Matches the 20m client_max_body_size already set in tls-proxy/nginx.conf -
; keeping these consistent so uploads aren't silently truncated at this layer.
upload_max_filesize = 20M
post_max_size = 20M

memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 1
