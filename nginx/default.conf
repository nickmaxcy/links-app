server {
    listen 80;
    root /var/www/html;
    index index.php;
    autoindex off;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Defense in depth - the app's own includes/*.php files already refuse
    # direct access themselves, but block dotfiles here too (.env, .git, etc.
    # should never be inside html/ anyway, but this guards against it).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
